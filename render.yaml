# Blueprint для Render: веб-сервис Next.js + бесплатная база PostgreSQL.
# Render → New → Blueprint → выберите репозиторий. Пароль админки Render спросит при создании.
services:
  - type: web
    name: lume-clinic
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: lume-db
          property: connectionString
      - key: ADMIN_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true

databases:
  - name: lume-db
    plan: free
    databaseName: lume
    user: lume
